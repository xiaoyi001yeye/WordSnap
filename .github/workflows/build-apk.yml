name: Build WordSnap APK

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      publishToServer:
        type: boolean
        default: false
        description: "Upload APKs and manifest to the configured release server"
      forceUpdate:
        type: boolean
        default: false
      minSupportedVersionCode:
        type: string
        default: "1"
      rolloutPercentage:
        type: string
        default: "100"
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    paths:
      - "lib/**"
      - "scripts/**"
      - "pubspec.yaml"
      - ".github/workflows/build-apk.yml"

env:
  FLUTTER_VERSION: "3.27.0"
  RELEASE_HOST: ${{ secrets.WORDSNAP_RELEASE_HOST || secrets.RELEASE_HOST || '39.104.67.175' }}
  RELEASE_REMOTE_DIR: ${{ secrets.WORDSNAP_RELEASE_REMOTE_DIR || '/opt/wordsnap/releases' }}
  RELEASE_PUBLIC_BASE_URL: ${{ secrets.WORDSNAP_RELEASE_PUBLIC_BASE_URL || 'http://39.104.67.175/downloads/wordsnap/android' }}
  RELEASE_MANIFEST_URL: ${{ secrets.WORDSNAP_RELEASE_MANIFEST_URL || 'http://39.104.67.175/downloads/wordsnap/manifests/latest-android-stable.json' }}
  RELEASE_CHANNEL: stable
  RELEASE_ENVIRONMENT: prod

concurrency:
  group: wordsnap-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Read Flutter version
        id: version
        run: |
          version_json="$(node scripts/print_flutter_version.js)"
          node -e '
            const v = JSON.parse(process.argv[1]);
            console.log(`version_name=${v.versionName}`);
            console.log(`version_code=${v.versionCode}`);
            console.log(`pubspec_version=${v.pubspecVersion}`);
            console.log(`expected_tag=${v.expectedTag}`);
          ' "$version_json" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "${{ steps.version.outputs.expected_tag }}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} must match pubspec.yaml visible version ${{ steps.version.outputs.expected_tag }}." >&2
            exit 1
          fi

      - name: Generate Android scaffold
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name wordsnap .
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          else
            echo "ANDROID_KEYSTORE_BASE64 is not configured. Falling back to debug signing."
          fi

      - name: Build release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=WORDSNAP_UPDATE_MANIFEST_URL="${{ env.RELEASE_MANIFEST_URL }}"

      - name: Rename APK artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/wordsnap-armeabi-v7a-release.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/wordsnap-arm64-v8a-release.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            build/app/outputs/flutter-apk/wordsnap-x86_64-release.apk

      - name: Upload armeabi-v7a APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordsnap-armeabi-v7a-release-apk
          path: build/app/outputs/flutter-apk/wordsnap-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Upload arm64-v8a APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordsnap-arm64-v8a-release-apk
          path: build/app/outputs/flutter-apk/wordsnap-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload x86_64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordsnap-x86_64-release-apk
          path: build/app/outputs/flutter-apk/wordsnap-x86_64-release.apk
          if-no-files-found: error

      - name: Publish APKs to latest installers release
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: latest-installers
          RELEASE_TITLE: WordSnap Latest Installers
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "Rolling installer downloads from the latest successful builds." \
              --prerelease || true
          fi

          gh release edit "$RELEASE_TAG" \
            --title "$RELEASE_TITLE" \
            --notes "Rolling installer downloads from the latest successful builds. Android split APKs were updated from commit $GITHUB_SHA." \
            --prerelease

          gh release delete-asset "$RELEASE_TAG" wordsnap-release.apk -y || true

          gh release upload "$RELEASE_TAG" \
            build/app/outputs/flutter-apk/wordsnap-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/wordsnap-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/wordsnap-x86_64-release.apk \
            --clobber

      - name: Publish APKs to version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/wordsnap-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/wordsnap-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/wordsnap-x86_64-release.apk
          generate_release_notes: true

      - name: Prepare Android release notes for server
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publishToServer
        run: |
          mkdir -p dist
          {
            echo "# WordSnap Android ${{ steps.version.outputs.pubspec_version }}"
            echo
            previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
            if [ -n "$previous_tag" ]; then
              git log --pretty=format:'- %s' "${previous_tag}..${GITHUB_SHA}"
            else
              echo "- Android release ${{ steps.version.outputs.pubspec_version }}"
            fi
          } > dist/android-release-notes.md

      - name: Configure release server SSH
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publishToServer
        env:
          RELEASE_USER: ${{ secrets.WORDSNAP_RELEASE_USER || secrets.RELEASE_USER }}
          RELEASE_SSH_KEY: ${{ secrets.WORDSNAP_RELEASE_SSH_KEY || secrets.RELEASE_SSH_KEY }}
        run: |
          if [ -z "$RELEASE_USER" ] || [ -z "$RELEASE_SSH_KEY" ]; then
            echo "WORDSNAP_RELEASE_USER/WORDSNAP_RELEASE_SSH_KEY or RELEASE_USER/RELEASE_SSH_KEY secrets are required to publish." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$RELEASE_SSH_KEY" > ~/.ssh/wordsnap_release_key
          chmod 600 ~/.ssh/wordsnap_release_key
          ssh-keyscan -H "${{ env.RELEASE_HOST }}" >> ~/.ssh/known_hosts
          {
            echo "Host wordsnap-release"
            echo "  HostName ${{ env.RELEASE_HOST }}"
            echo "  User $RELEASE_USER"
            echo "  IdentityFile ~/.ssh/wordsnap_release_key"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config

      - name: Publish APKs and manifest to release server
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publishToServer
        env:
          RELEASE_HOST: wordsnap-release
          RELEASE_USER: ${{ secrets.WORDSNAP_RELEASE_USER || secrets.RELEASE_USER }}
          RELEASE_REMOTE_DIR: ${{ env.RELEASE_REMOTE_DIR }}
          RELEASE_PUBLIC_BASE_URL: ${{ env.RELEASE_PUBLIC_BASE_URL }}
          APK_PATHS: |
            build/app/outputs/flutter-apk/wordsnap-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/wordsnap-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/wordsnap-x86_64-release.apk
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_CHANNEL: ${{ env.RELEASE_CHANNEL }}
          RELEASE_ENVIRONMENT: ${{ env.RELEASE_ENVIRONMENT }}
          FORCE_UPDATE: ${{ inputs.forceUpdate || 'false' }}
          MIN_SUPPORTED_VERSION_CODE: ${{ inputs.minSupportedVersionCode || '1' }}
          ROLLOUT_PERCENTAGE: ${{ inputs.rolloutPercentage || '100' }}
          RELEASE_NOTES_FILE: dist/android-release-notes.md
          GIT_TAG: ${{ steps.version.outputs.expected_tag }}
        run: ./scripts/publish_android_release.sh
